[package]
name = "scx_adaptive"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Adaptive userspace sched_ext scheduler with Agent supplied task classes"

[dependencies]
anyhow = "1.0.65"
clap = { version = "4.5.28", features = ["derive"] }
ctrlc = { version = "3.1", features = ["termination"] }
libbpf-rs = "=0.26.0-beta.1"
libc = "0.2.175"
log = "0.4.17"
plain = "0.2.3"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0"
simplelog = "0.12"
thiserror = "2.0"

# These path dependencies provide the pinned sched_ext compatibility layer.
# They do not provide, and are not used for, this scheduler's policy.
scx_utils = { path = "../scx/rust/scx_utils", version = "1.0.25" }

[build-dependencies]
anyhow = "1.0.65"
scx_cargo = { path = "../scx/rust/scx_cargo", version = "1.0.25" }

[profile.release]
lto = "thin"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
