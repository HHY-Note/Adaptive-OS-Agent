[package]
name = "adaptive-os-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Workload classification Agent for scx_adaptive"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
ctrlc = { version = "3.1", features = ["termination"] }
log = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simplelog = "0.12"
thiserror = "2.0"
toml = "0.8"
