worker_processes auto;
error_log stderr warn;
pid /run/aoa-real-workloads/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    sendfile on;
    keepalive_timeout 30;
    client_body_temp_path /var/tmp/aoa-real-workloads/nginx-client;
    proxy_temp_path /var/tmp/aoa-real-workloads/nginx-proxy;
    fastcgi_temp_path /var/tmp/aoa-real-workloads/nginx-fastcgi;
    uwsgi_temp_path /var/tmp/aoa-real-workloads/nginx-uwsgi;
    scgi_temp_path /var/tmp/aoa-real-workloads/nginx-scgi;
    server {
        listen 127.0.0.1:18080;
        location / {
            root /opt/aoa-workloads/www;
        }
    }
}
